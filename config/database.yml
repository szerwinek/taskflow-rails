default: &default
  adapter: postgresql
  encoding: unicode
  pool: <%= ENV.fetch("RAILS_MAX_THREADS", 5) %>
  url: <%= ENV["DATABASE_URL"] %>

development:
  <<: *default
  database: task_manager_rails_development

test:
  <<: *default
  database: task_manager_rails_test

production:
  <<: *default
  database: <%= ENV.fetch("DATABASE_NAME", "task_manager_rails_production") %>
  username: <%= ENV["DATABASE_USERNAME"] %>
  password: <%= ENV["DATABASE_PASSWORD"] %>
  host: <%= ENV["DATABASE_HOST"] %>
